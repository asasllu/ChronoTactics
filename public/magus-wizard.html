<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magus the Vampire Wizard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06040c; }
  canvas {
    display: block; width: 100vw; height: 100vh;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
// Magus, vampire wizard — a 128x96 indexed-colour pixel animation.
// Everything is drawn into a Uint8Array of palette indices, converted through a
// Uint32 palette LUT into one ImageData, then blitted at an integer scale.
(function () {
  'use strict';

  // ---- Logical screen & palette ------------------------------------------------------
  const W = 128, H = 96, TAU = Math.PI * 2;
  const PAL = [
    '#06040c', // 0  outline / near-black
    '#0f0c24', // 1  sky top
    '#19153a', // 2  sky mid
    '#262050', // 3  sky low
    '#0c0a1c', // 4  distant silhouettes
    '#3b3566', // 5  stone dark
    '#5d5790', // 6  stone mid
    '#8c88b4', // 7  stone light / moon shade
    '#efe9cf', // 8  moon / star
    '#ffffff', // 9  white
    '#c9d6f0', // 10 skin (Magus pale blue)
    '#8a9ccc', // 11 skin shade
    '#6fa8f0', // 12 hair
    '#3a5cb8', // 13 hair shade
    '#e0263e', // 14 blood red (eyes, hat band)
    '#2a0a1a', // 15 cape
    '#5c1228', // 16 robe dark
    '#8f1f36', // 17 robe
    '#c23a48', // 18 robe light / cape lining
    '#e8b04a', // 19 gold
    '#6b4226', // 20 wood dark
    '#a06a3a', // 21 wood
    '#b54cff', // 22 magic
    '#e6c4ff', // 23 magic light
    '#5a1c9c', // 24 magic dark
    '#4ef0ff', // 25 magic cyan
    '#3a1a5e', // 26 hat
    '#5a2e8a', // 27 hat light
  ];
  const OUT = 0, SKY0 = 1, SKY1 = 2, SKY2 = 3, SIL = 4, ST0 = 5, ST1 = 6, ST2 = 7, MOON = 8, WHITE = 9,
    SKIN = 10, SKIN_D = 11, HAIR = 12, HAIR_D = 13, RED = 14, CAPE = 15, ROBE_D = 16, ROBE = 17,
    ROBE_L = 18, GOLD = 19, WOOD_D = 20, WOOD = 21, MAG = 22, MAG_L = 23, MAG_D = 24, CYAN = 25,
    HAT = 26, HAT_L = 27;

  const littleEndian = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
  function pack(hex) {
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (littleEndian ? (0xff000000 | (b << 16) | (g << 8) | r) : ((r << 24) | (g << 16) | (b << 8) | 0xff)) >>> 0;
  }
  const pal32 = new Uint32Array(PAL.length);
  for (let i = 0; i < PAL.length; i++) pal32[i] = pack(PAL[i]);
  // Cast flash: every index maps to a brighter palette entry for a few ticks.
  const FMAP = [OUT, SKY1, SKY2, ST0, SKY1, ST1, ST2, MOON, WHITE, WHITE, WHITE, SKIN, MAG_L, HAIR,
    ROBE_L, ROBE_D, ROBE, ROBE_L, ROBE_L, MOON, WOOD, GOLD, MAG_L, WHITE, MAG, WHITE, HAT_L, MAG];
  const flash32 = new Uint32Array(PAL.length);
  for (let i = 0; i < PAL.length; i++) flash32[i] = pal32[FMAP[i]];

  // ---- Canvases ----------------------------------------------------------------------
  const disp = document.getElementById('screen');
  const dctx = disp.getContext('2d', { alpha: false });
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  const img = octx.createImageData(W, H);
  const out32 = new Uint32Array(img.data.buffer);
  const fb = new Uint8Array(W * H);
  const bg = new Uint8Array(W * H);
  let scale = 1, ox = 0, oy = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.max(1, Math.round(window.innerWidth * dpr));
    const ch = Math.max(1, Math.round(window.innerHeight * dpr));
    disp.width = cw; disp.height = ch;
    scale = Math.max(1, Math.floor(Math.min(cw / W, ch / H)));
    ox = (cw - W * scale) >> 1; oy = (ch - H * scale) >> 1;
    dctx.imageSmoothingEnabled = false;
    dctx.fillStyle = PAL[OUT];
    dctx.fillRect(0, 0, cw, ch);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Deterministic PRNG (reseeded each cycle so every loop is identical) ------------
  // State lives in a Uint32Array: 32-bit values would otherwise be boxed as heap numbers.
  const seed = new Uint32Array(1);
  function rnd() {
    let s = seed[0];
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    seed[0] = s;
    return seed[0] / 4294967296;
  }

  function put(x, y, c) {
    if (x >= 0 && y >= 0 && x < W && y < H) fb[y * W + x] = c;
  }
  function isBack(v) { return v >= SKY0 && v <= SIL; } // sky & distant silhouettes

  // ---- Static background -------------------------------------------------------------
  const BAYER = [0, 2, 3, 1];
  const MX = 100, MY = 19, MR = 9;
  (function buildBackground() {
    for (let y = 0; y < 80; y++) {
      for (let x = 0; x < W; x++) {
        const b = BAYER[(y & 1) * 2 + (x & 1)];
        let c;
        if (y < 18) c = SKY0;
        else if (y < 22) c = b < y - 17 ? SKY1 : SKY0;
        else if (y < 42) c = SKY1;
        else if (y < 46) c = b < y - 41 ? SKY2 : SKY1;
        else c = SKY2;
        bg[y * W + x] = c;
      }
    }
    // Moon with a dithered halo and craters.
    const craters = [97, 16, 1.7, 103, 22, 1.4, 104, 14, 1.0, 95, 22, 1.1];
    for (let y = 0; y < 34; y++) {
      for (let x = 84; x < 118; x++) {
        const dx = x - MX, dy = y - MY, d = Math.sqrt(dx * dx + dy * dy), i = y * W + x;
        if (d <= MR + 0.3) {
          let c = MOON;
          if (dx * 0.8 + dy * 0.35 < -MR * 0.5 || (d > MR - 1.1 && dx < -2)) c = ST2;
          for (let k = 0; k < craters.length; k += 3) {
            const cx = x - craters[k], cy = y - craters[k + 1];
            if (cx * cx + cy * cy <= craters[k + 2] * craters[k + 2]) c = ST2;
          }
          bg[i] = c;
        } else if (d <= MR + 3.6 && ((x + y) & 1) === 0) {
          bg[i] = bg[i] === SKY0 ? SKY1 : SKY2;
        }
      }
    }
    // Rolling hills, then Dracula's castle on the right.
    for (let x = 0; x < W; x++) {
      const h = Math.round(76 - x * 0.04 + Math.sin(x * 0.09) * 1.6 + Math.sin(x * 0.23 + 1.3) * 0.9);
      for (let y = h; y < 80; y++) bg[y * W + x] = SIL;
    }
    function rect(x, y, w, h, c) {
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) bg[(y + j) * W + x + i] = c;
    }
    rect(108, 60, 11, 20, SIL);
    for (let x = 108; x <= 118; x += 2) bg[59 * W + x] = SIL;
    rect(103, 56, 4, 24, SIL); rect(103, 55, 4, 1, SIL); rect(104, 52, 2, 3, SIL); bg[51 * W + 104] = SIL;
    rect(119, 53, 4, 27, SIL); rect(119, 52, 4, 1, SIL); rect(120, 49, 2, 3, SIL); bg[48 * W + 120] = SIL;
    rect(99, 66, 4, 14, SIL); rect(100, 64, 2, 2, SIL);
    // Stone floor: lit lip, then staggered bricks.
    for (let x = 0; x < W; x++) { bg[80 * W + x] = ST2; bg[81 * W + x] = ST1; }
    for (let y = 82; y < H; y++) {
      const row = ((y - 82) / 5) | 0, yy = (y - 82) % 5;
      for (let x = 0; x < W; x++) {
        const bx = (x + (row & 1) * 6) % 12;
        let c = yy === 4 || bx === 11 ? SIL : yy === 0 ? ST1 : ST0;
        const hsh = ((x * 73856093) ^ (y * 19349663)) >>> 0;
        if (c === ST0 && hsh % 23 === 0) c = SIL;
        if (y >= 92 && c === ST1) c = ST0;
        bg[y * W + x] = c;
      }
    }
  })();

  // Stars: 1px, twinkling on periods that divide the 630-tick ambient loop.
  const NS = 26, PERIODS = [63, 70, 90, 105, 126, 210];
  const starX = new Uint8Array(NS), starY = new Uint8Array(NS), starP = new Uint16Array(NS), starO = new Uint16Array(NS);
  (function placeStars() {
    seed[0] = 0x1234567;
    let n = 0, guard = 0;
    while (n < NS && guard++ < 5000) {
      const x = (rnd() * W) | 0, y = (rnd() * 62) | 0;
      const dx = x - MX, dy = y - MY;
      if (dx * dx + dy * dy < (MR + 5) * (MR + 5)) continue;
      if (!isBack(bg[y * W + x]) || bg[y * W + x] === SIL) continue;
      starX[n] = x; starY[n] = y;
      starP[n] = PERIODS[(rnd() * PERIODS.length) | 0];
      starO[n] = (rnd() * 630) | 0;
      n++;
    }
  })();

  // ---- Character sprite buffer -------------------------------------------------------
  // The wizard is rebuilt procedurally into this buffer whenever the pose is resampled
  // (10 fps), then outlined and rim-lit, then blitted onto the scene.
  const SW = 72, SH = 64, AX = 24, AY = 58;   // anchor = feet centre
  const WX = 34, WY = 80;                      // anchor position in the world
  const EMPTY = 255, OL = 254;
  const spr = new Uint8Array(SW * SH);

  function sp(x, y, c) {
    x += AX; y += AY;
    if (x >= 0 && y >= 0 && x < SW && y < SH) spr[y * SW + x] = c;
  }
  function srun(x0, x1, y, c) { for (let x = x0; x <= x1; x++) sp(x, y, c); }
  function srect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) sp(x + i, y + j, c); }
  // Bresenham staff with wood grain; pixels below maxY are clipped (floor).
  function staffLine(x0, y0, x1, y1, maxY) {
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, k = 0;
    for (;;) {
      if (y0 <= maxY) sp(x0, y0, (k++ & 3) === 3 ? WOOD_D : WOOD);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  // Two-pixel-thick sleeve with a lit top edge and shaded underside.
  function sleeve(x0, y0, x1, y1) {
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      sp(x0, y0 + 1, ROBE_D); sp(x0 + 1, y0 + 1, ROBE_D);
      sp(x0, y0, ROBE); sp(x0 + 1, y0, ROBE);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  const SCALLOP = [0, 1, 2, 1];                                  // bat-wing cape hem
  const COLLAR = [-6, -1, -6, -2, -6, -3, -7, -4, -7, -5, -8, -6, -8, -7, -9, -9];
  const HATROWS = [-4, 4, -3, 3, -3, 3, -2, 2, -2, 2, -2, 1, -2, 1, -3, 0, -4, -1, -5, -2, -7, -4];
  const BEARDW = [5, 5, 5, 4, 4, 4, 3, 3, 2, 2, 1];
  const PRONG_P = [1, 2, 3, 3, 2], PRONG_D = [0, 1, 2, 3, 4];

  // Pose channels.
  const RAISE = 0, REACH = 1, ANG = 2, TILT = 3, SWAY = 4, BEARD = 5, HATB = 6, GLOW = 7, NCH = 8;
  const S = new Float32Array(NCH);            // the quantised (10 fps) snapshot that gets drawn
  let bobS = 0, eyeFlash = 0;
  let gemLX = 0, gemLY = 0, gemWX = 0, gemWY = 0;

  function buildSprite() {
    spr.fill(EMPTY);
    const b = bobS, g = S[GLOW];
    const raise = S[RAISE], reach = S[REACH], ang = S[ANG];
    const tilt = Math.round(S[TILT]), sway = Math.round(S[SWAY]);
    const brd = Math.round(S[BEARD]), hatb = Math.round(S[HATB]);
    const top = -19 + b;                                   // shoulder line

    // Staff geometry (hand grips the staff; gem sits beyond the top).
    const hxf = 6 + 5 * reach + 2 * raise, hyf = -11 - 13 * raise + b;
    const hx = Math.round(hxf), hy = Math.round(hyf);
    const dx = Math.sin(ang), dy = -Math.cos(ang);
    const txf = hxf + dx * 21, tyf = hyf + dy * 21;
    gemLX = Math.round(hxf + dx * 23.5); gemLY = Math.round(hyf + dy * 23.5);

    // Cape, flaring behind with a scalloped bat-wing hem and red lining on the trailing edge.
    const capeH = -1 - top;
    for (let y = top; y <= -1; y++) {
      const t = (y - top) / capeH;
      const xl = -5 - Math.round(6 * t) + Math.round(sway * t * t);
      for (let x = xl; x <= 1; x++) {
        if (y > -1 - SCALLOP[(x + 64) & 3]) continue;
        let c = CAPE;
        if (x === xl && t > 0.4) c = ROBE_L;
        else if (((x - xl) & 3) === 2 && t > 0.35) c = ROBE_D;
        sp(x, y, c);
      }
    }

    // Robe: two-tone crimson, gold-trimmed opening, dark sash, dithered gold hem.
    const robeH = -2 - top, beltY = top + 8;
    for (let y = top; y <= -2; y++) {
      const t = (y - top) / robeH;
      const cx = Math.round(sway * t * t);
      let xl = cx - 4 - Math.round(3 * t), xr = cx + 3 + Math.round(3 * t);
      if (y === top) { xl++; xr--; }
      for (let x = xl; x <= xr; x++) {
        const r = x - cx;
        let c = ROBE;
        if (x <= xl + 1) c = ROBE_D;
        else if (x === xr) c = ROBE_L;
        else if (r === -2 && t > 0.45) c = ROBE_D;
        if (y > top + 1) { if (r === 1) c = CAPE; else if (r === 2) c = GOLD; }
        if (y === beltY) c = r === 1 || r === 2 ? GOLD : CAPE;
        if (y === -3) c = (x & 1) ? GOLD : ROBE_D;
        if (y === -2) c = ROBE_D;
        sp(x, y, c);
      }
    }
    // Boots.
    srect(-3, -1, 3, 2, CAPE);
    srect(1, -1, 4, 2, HAT); sp(5, 0, HAT); sp(4, -1, HAT_L);

    // High vampire collar behind the head.
    for (let k = 0; k < 8; k++) {
      const y = top - k, a = COLLAR[k * 2], e = COLLAR[k * 2 + 1];
      for (let x = a; x <= e; x++) sp(x, y, x === a ? CAPE : x === e ? ROBE_L : ROBE);
    }

    // Long blue hair spilling down the back.
    const fx0 = -2 + tilt, fy0 = -28 + b, fx1 = fx0 + 5;
    const hairEnd = top + 9, hairLen = hairEnd - fy0 - 1;
    for (let y = fy0 + 1; y <= hairEnd; y++) {
      const t = (y - fy0 - 1) / hairLen;
      const sh = Math.round(brd * 0.6 * t) - Math.round(t * 2);
      let xl = fx0 - 3 + sh - (t > 0.45 ? 1 : 0), xr = fx0 - 1 + sh;
      if (y >= hairEnd - 1) xl++;
      if (y === hairEnd) xr--;
      for (let x = xl; x <= xr; x++) sp(x, y, ((x + y) % 3) === 0 && x !== xl ? HAIR : HAIR_D);
    }

    // Face: pale blue skin, pointed ear, angry brow, blood-red eye, aquiline nose.
    srect(fx0, fy0, 6, 7, SKIN);
    for (let y = fy0 + 2; y < fy0 + 6; y++) sp(fx0, y, SKIN_D);
    srect(fx0 - 2, fy0, 2, 5, HAIR_D); sp(fx0 - 1, fy0, HAIR);
    srun(fx0, fx0 + 3, fy0, HAIR); sp(fx0 + 4, fy0, HAIR_D);
    sp(fx0, fy0 + 1, HAIR_D);
    sp(fx0 - 1, fy0 + 2, SKIN); sp(fx0 - 2, fy0 + 2, SKIN); sp(fx0 - 3, fy0 + 1, SKIN); sp(fx0 - 1, fy0 + 3, SKIN_D);
    srun(fx0 + 2, fx0 + 4, fy0 + 1, HAIR_D);
    sp(fx0 + 2, fy0 + 2, SKIN_D);
    sp(fx0 + 3, fy0 + 2, eyeFlash ? WHITE : RED);
    sp(fx0 + 1, fy0 + 4, SKIN_D);
    sp(fx1 + 1, fy0 + 3, SKIN); sp(fx1, fy0 + 4, SKIN_D);
    srun(fx0 + 2, fx1, fy0 + 5, HAIR_D); sp(fx1 + 1, fy0 + 5, HAIR_D); sp(fx1 + 1, fy0 + 6, HAIR_D);

    // Pointed hat with a floppy bent tip, red band and gold buckle.
    const hc = tilt;
    srun(hc - 6, hc + 5, fy0 - 1, HAT); sp(hc + 6, fy0 - 1, HAT_L); sp(hc - 6, fy0 - 1, HAT_L);
    for (let k = 0; k < 11; k++) {
      const y = fy0 - 2 - k, s = k >= 7 ? hatb : 0;
      const xl = hc + HATROWS[k * 2] + s, xr = hc + HATROWS[k * 2 + 1] + s;
      for (let x = xl; x <= xr; x++) {
        let c = x === xr ? HAT_L : HAT;
        if (k === 0) c = x === hc + 1 ? GOLD : RED;
        else if (k >= 2 && k <= 5 && x === xl + 1) c = SIL;
        sp(x, y, c);
      }
    }
    sp(hc - 8 + hatb, fy0 - 12, HAT); sp(hc - 8 + hatb, fy0 - 11, HAT);
    sp(hc - 9 + hatb, fy0 - 11, HAT); sp(hc - 9 + hatb, fy0 - 10, HAT);
    sp(hc - 9 + hatb, fy0 - 9, GOLD);
    sp(hc + 1, fy0 - 6, GOLD);

    // Staff with a gold claw cradling the gem.
    staffLine(Math.round(hxf - dx * 12), Math.round(hyf - dy * 12), Math.round(txf), Math.round(tyf), 0);
    sp(Math.round(hxf + dx * 19), Math.round(hyf + dy * 19), GOLD);
    const px = -dy, py = dx;
    for (let s = -1; s <= 1; s += 2) {
      for (let k = 0; k < 5; k++) {
        const pa = PRONG_P[k] * s, pd = PRONG_D[k];
        sp(Math.round(txf + px * pa + dx * pd), Math.round(tyf + py * pa + dy * pd), GOLD);
      }
    }

    // Sleeve, gold cuff and gripping hand.
    const shx = 2, shy = top + 1;
    sleeve(shx, shy, hx, hy);
    const cfx = Math.round(shx + (hx - shx) * 0.78), cfy = Math.round(shy + (hy - shy) * 0.78);
    sp(cfx, cfy, GOLD); sp(cfx + 1, cfy, GOLD);
    srect(hx - 1, hy - 1, 2, 2, SKIN); sp(hx - 1, hy, SKIN_D);

    // Long pointed beard (sways), the fang, and the front collar point.
    for (let i = 0; i < 11; i++) {
      const y = fy0 + 6 + i, t = i / 10;
      const xr = fx1 - (i > 4 ? (i - 4) >> 1 : 0) + Math.round(brd * t);
      const xl = xr - BEARDW[i] + 1;
      for (let x = xl; x <= xr; x++) {
        let c = x <= xl ? HAIR_D : HAIR;
        if (((x + i) & 3) === 0 && x < xr) c = HAIR_D;
        else if (x === xr && i < 7) c = SKIN;             // silvery lit edge
        sp(x, y, c);
      }
    }
    sp(fx1 - 1, fy0 + 6, WHITE);
    sp(3, top, ROBE_L); sp(4, top, ROBE_L); sp(4, top - 1, ROBE_L); sp(5, top - 2, ROBE_L); sp(5, top - 3, ROBE);

    // Outline pass: every empty pixel touching the figure becomes outline.
    for (let y = 1; y < SH - 1; y++) {
      for (let x = 1; x < SW - 1; x++) {
        const i = y * SW + x;
        if (spr[i] !== EMPTY) continue;
        if (spr[i - 1] < OL || spr[i + 1] < OL || spr[i - SW] < OL || spr[i + SW] < OL) spr[i] = OL;
      }
    }

    // Rim-light pass: edge pixels facing the gem pick up its light.
    const gsx = AX + gemLX, gsy = AY + gemLY;
    const R = 7 + g * 23, R2 = R * R, Rin2 = R2 * 0.2;
    const near = g > 0.65 ? MAG_L : g > 0.5 ? MAG : MAG_D, far = g > 0.5 ? MAG : MAG_D;
    for (let y = 1; y < SH - 1; y++) {
      for (let x = 1; x < SW - 1; x++) {
        const i = y * SW + x;
        if (spr[i] >= OL) continue;
        const ddx = gsx - x, ddy = gsy - y, d2 = ddx * ddx + ddy * ddy;
        if (d2 > R2 || d2 < 3) continue;
        const ax = ddx < 0 ? -ddx : ddx, ay = ddy < 0 ? -ddy : ddy;
        let edge = false;
        if (ax * 2 >= ay && spr[i + (ddx > 0 ? 1 : -1)] >= OL) edge = true;
        if (!edge && ay * 2 >= ax && spr[i + (ddy > 0 ? SW : -SW)] >= OL) edge = true;
        if (edge) spr[i] = d2 < Rin2 ? near : far;
      }
    }

    gemWX = WX + gemLX; gemWY = WY + gemLY;
  }

  // ---- Animation state machine -------------------------------------------------------
  const IDLE = 0, CHARGE = 1, CAST = 2, RECOVER = 3;
  const DUR = [150, 96, 30, 39];               // 315 ticks = 5.25 s per cycle
  const KEYS = [
    new Float32Array([0, 0, 0.10, 0, 0, 0, 0, 0.3]),     // IDLE
    new Float32Array([1, 0, -0.15, -1, 0, 0, 0, 1]),     // CHARGE: staff overhead, head tilted up
    new Float32Array([0.55, 1, 1.05, 1, -2, -2, -1, 1]), // CAST: thrust forward, robes blown back
    new Float32Array([0, 0, 0.10, 0, 0, 0, 0, 0.3]),     // RECOVER: settle back to idle
  ];
  const from = new Float32Array(NCH), base = new Float32Array(NCH), live = new Float32Array(NCH);
  let state = IDLE, st = 0, tick = 0, needSnap = true;
  base.set(KEYS[IDLE]);

  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - (2 - 2 * t) * (2 - 2 * t) / 2; }
  function easeOutBack(t) { const u = t - 1; return 1 + 2.70158 * u * u * u + 1.70158 * u * u; }

  function enter(s) {
    state = s; st = 0; needSnap = true;
    from.set(base);
    if (s === IDLE) seed[0] = 0x2545f491;
  }

  // ---- Pooled particles (struct of arrays, no allocation after startup) --------------
  const NP = 256, FREE = 1, ORBIT = 2;
  const pX = new Float32Array(NP), pY = new Float32Array(NP), pVX = new Float32Array(NP), pVY = new Float32Array(NP);
  const pL = new Float32Array(NP), pMax = new Float32Array(NP), pD = new Float32Array(NP), pG = new Float32Array(NP);
  const pA = new Float32Array(NP), pAV = new Float32Array(NP), pR = new Float32Array(NP), pRV = new Float32Array(NP);
  const pM = new Uint8Array(NP), pRamp = new Uint8Array(NP);
  // Two 8-step ramps: white -> magic -> dark.
  const RAMP = new Uint8Array([
    WHITE, MAG_L, MAG, MAG, MAG, MAG_D, MAG_D, SKY1,
    WHITE, WHITE, CYAN, CYAN, MAG, MAG_D, MAG_D, SKY1,
  ]);
  let pCur = 0;
  function alloc() {
    for (let k = 0; k < NP; k++) {
      const i = (pCur + k) & (NP - 1);
      if (pM[i] === 0) { pCur = (i + 1) & (NP - 1); return i; }
    }
    const i = pCur; pCur = (pCur + 1) & (NP - 1); return i;
  }
  function spawnFree(x, y, vx, vy, life, drag, grav, ramp) {
    const i = alloc();
    pM[i] = FREE; pX[i] = x; pY[i] = y; pVX[i] = vx; pVY[i] = vy;
    pL[i] = pMax[i] = life; pD[i] = drag; pG[i] = grav; pRamp[i] = ramp;
  }
  function spawnOrbit() {
    const i = alloc();
    pM[i] = ORBIT; pA[i] = rnd() * TAU; pR[i] = 11 + rnd() * 8;
    pAV[i] = 0.07 + rnd() * 0.05; pRV[i] = 0.16 + rnd() * 0.12;
    pL[i] = pMax[i] = Math.ceil(pR[i] / pRV[i]) + 2;
    pRamp[i] = rnd() < 0.3 ? 1 : 0;
    pX[i] = gemWX + Math.cos(pA[i]) * pR[i]; pY[i] = gemWY + Math.sin(pA[i]) * pR[i] * 0.8;
  }

  // Projectile, burst ring, shake and flash.
  let prOn = 0, prAge = 0;
  const pr = new Float32Array(3); // projectile x, y, base y
  let ringT = 99, fireX = 0, fireY = 0, shakeT = 0, flashT = 0;
  const SHX = [2, -2, 1, -1, 2, -1, 1, 0, -1, 0], SHY = [-1, 1, 0, 1, -1, 0, 1, 0, 0, 0];

  function fire() {
    fireX = gemWX; fireY = gemWY;
    // Orbiting sparks explode outward.
    for (let i = 0; i < NP; i++) {
      if (pM[i] !== ORBIT) continue;
      const s = 1.2 + rnd() * 1.6;
      pM[i] = FREE; pVX[i] = Math.cos(pA[i]) * s; pVY[i] = Math.sin(pA[i]) * s;
      pD[i] = 0.9; pG[i] = 0.03; pL[i] = pMax[i] = 16 + ((rnd() * 20) | 0);
    }
    for (let k = 0; k < 44; k++) {
      const a = rnd() * TAU, s = 0.5 + rnd() * 2.2;
      spawnFree(fireX, fireY, Math.cos(a) * s, Math.sin(a) * s - 0.3, 16 + ((rnd() * 28) | 0), 0.9, 0.035, rnd() < 0.5 ? 0 : 1);
    }
    for (let k = 0; k < 18; k++) {
      const a = -0.35 + (rnd() - 0.5) * 0.6, s = 2 + rnd() * 2;
      spawnFree(fireX, fireY, Math.cos(a) * s, Math.sin(a) * s, 10 + ((rnd() * 10) | 0), 0.92, 0.01, 1);
    }
    prOn = 1; pr[0] = fireX + 3; pr[1] = pr[2] = fireY; prAge = 0;
    ringT = 0; shakeT = 10; flashT = 3; eyeFlash = 1;
  }

  // ---- Fixed 60 Hz update ------------------------------------------------------------
  function update() {
    tick++; st++;
    if (st >= DUR[state]) enter((state + 1) & 3);

    const to = KEYS[state];
    let e;
    if (state === IDLE) e = 1;
    else if (state === CHARGE) e = easeInOut(Math.min(1, st / 60));
    else if (state === CAST) e = easeOutBack(Math.min(1, st / 4));
    else e = easeInOut(st / DUR[RECOVER]);
    for (let i = 0; i < NCH; i++) live[i] = base[i] = from[i] + (to[i] - from[i]) * e;

    let bob = 0;
    if (state === IDLE) {
      const s = Math.sin(st * TAU / 75);
      live[SWAY] += 0.7 * s; live[BEARD] += 1.3 * s; live[HATB] -= 1.1 * s;
      live[GLOW] += 0.08 * Math.sin(st * TAU / 50);
      bob = ((st / 25) | 0) & 1;
    } else if (state === CHARGE) {
      const a = Math.min(1, st / 40);
      live[SWAY] += 0.7 * a * Math.sin(st * 0.55);
      live[BEARD] += 1.2 * a * Math.sin(st * 0.41 + 1);
      live[HATB] += a * Math.sin(st * 0.33);
      live[ANG] += 0.04 * a * Math.sin(st * 1.9);
    } else if (state === CAST) {
      live[BEARD] += 0.8 * Math.sin(st * 0.9);
      if (st === 2 || st === 4) needSnap = true;   // smear frames for the thrust
      if (st === 14) { eyeFlash = 0; needSnap = true; }
    }

    // Sample the smooth pose onto the pixel grid at 10 fps.
    if (needSnap || tick % 6 === 0) {
      S.set(live); bobS = bob; needSnap = false;
      buildSprite();
    }
    if (state === CAST && st === 4) fire();

    // Emitters.
    if (state === CHARGE && st < 86 && (st & 1) === 0) { spawnOrbit(); if (st > 44) spawnOrbit(); }
    if (state === CAST && st > 6 && (st & 1)) {
      spawnFree(gemWX + rnd() * 6 - 3, gemWY + rnd() * 6 - 3, (rnd() - 0.5) * 0.3, -0.1 - rnd() * 0.2, 30 + ((rnd() * 25) | 0), 0.98, 0.004, 0);
    }
    if (state === RECOVER && (st & 3) === 0 && st < 30) {
      spawnFree(gemWX + rnd() * 6 - 3, gemWY + rnd() * 6 - 3, (rnd() - 0.5) * 0.25, -0.08 - rnd() * 0.15, 30 + ((rnd() * 25) | 0), 0.98, 0.004, 0);
    }
    if (state === IDLE && st % 25 === 12) {
      spawnFree(gemWX + rnd() * 8 - 4, gemWY + rnd() * 6 - 3, (rnd() - 0.5) * 0.1, -0.12, 40 + ((rnd() * 20) | 0), 0.99, 0, 0);
    }

    // Particles.
    for (let i = 0; i < NP; i++) {
      const m = pM[i];
      if (m === 0) continue;
      if (--pL[i] <= 0) { pM[i] = 0; continue; }
      if (m === ORBIT) {
        pA[i] += pAV[i]; pAV[i] *= 1.012; pR[i] -= pRV[i];
        if (pR[i] <= 0.6) { pM[i] = 0; continue; }
        pX[i] = gemWX + Math.cos(pA[i]) * pR[i];
        pY[i] = gemWY + Math.sin(pA[i]) * pR[i] * 0.8;
      } else {
        pVX[i] *= pD[i]; pVY[i] = pVY[i] * pD[i] + pG[i];
        pX[i] += pVX[i]; pY[i] += pVY[i];
        if (pY[i] > 79) { pY[i] = 79; pVY[i] *= -0.4; pVX[i] *= 0.7; }
      }
    }

    // Projectile with a sparkling trail.
    if (prOn) {
      prAge++; pr[0] += 2.5; pr[1] = pr[2] + Math.sin(prAge * 0.4) * 1.5;
      for (let k = 0; k < 2; k++) {
        spawnFree(pr[0] - 2 + rnd() * 2, pr[1] + rnd() * 3 - 1.5, -0.3 - rnd() * 0.4, (rnd() - 0.5) * 0.4, 10 + ((rnd() * 14) | 0), 0.94, 0, rnd() < 0.5 ? 0 : 1);
      }
      if (pr[0] > W + 10) prOn = 0;
    }
    if (ringT < 99) ringT++;
    if (shakeT > 0) shakeT--;
    if (flashT > 0) flashT--;
  }

  // ---- Rendering ---------------------------------------------------------------------
  const BAT_UP = [-3, -2, -2, -1, -1, 0, 0, 0, 1, 0, 2, -1, 3, -2, 0, 1, -1, -1, 1, -1];
  const BAT_DN = [-3, 1, -2, 0, -1, 0, 0, 0, 1, 0, 2, 0, 3, 1, 0, 1, -1, -1, 1, -1];
  const COS64 = new Float32Array(64), SIN64 = new Float32Array(64);
  for (let k = 0; k < 64; k++) { COS64[k] = Math.cos(k * TAU / 64); SIN64[k] = Math.sin(k * TAU / 64); }

  function drawAmbient() {
    const aT = (tick - tick % 6) % 630;         // 10 fps ambient clock, loops every 10.5 s
    for (let i = 0; i < NS; i++) {
      const v = Math.sin(((aT + starO[i]) % starP[i]) / starP[i] * TAU);
      const x = starX[i], y = starY[i];
      if (v > 0.9) {
        put(x, y, WHITE);
        if (i < 3) { put(x - 1, y, ST2); put(x + 1, y, ST2); put(x, y - 1, ST2); put(x, y + 1, ST2); }
      } else put(x, y, v > 0.4 ? MOON : v > -0.3 ? ST2 : ST0);
    }
    // Castle windows (one flickers).
    put(112, 64, GOLD); put(115, 64, GOLD); put(120, 57, GOLD);
    if (((aT / 18) | 0) % 7 !== 3) put(104, 59, GOLD);
    // Two bats crossing the moon.
    for (let b = 0; b < 2; b++) {
      const bx = Math.round(-10 + ((aT + b * 315) % 630) * (150 / 630));
      const by = 17 + b * 11 + Math.round(2 * Math.sin(aT * TAU / 210 + b * 2));
      const shape = (((aT / 12) | 0) + b) & 1 ? BAT_UP : BAT_DN;
      for (let k = 0; k < shape.length; k += 2) put(bx + shape[k], by + shape[k + 1], OUT);
    }
  }

  function drawFloorLight(g) {
    // Contact shadow, then the gem's light pooling on the floor lip.
    for (let x = WX - 8; x <= WX + 7; x++) put(x, 80, ST0);
    for (let x = WX - 6; x <= WX + 5; x++) put(x, 81, ST0);
    const rf = g * g * 26;
    if (rf < 2) return;
    for (let x = 0; x < W; x++) {
      const d = Math.abs(x - gemWX);
      if (d >= rf) continue;
      if (d < rf * 0.35) { put(x, 80, MAG_L); if (x & 1) put(x, 81, MAG); }
      else if (d < rf * 0.7) { put(x, 80, MAG); if ((x & 1) === 0) put(x, 81, MAG_D); }
      else if (x & 1) put(x, 80, MAG_D);
    }
  }

  function drawHalo(g) {
    // Dithered glow behind the gem; only touches sky pixels so it sits behind everything.
    const R = 2.5 + g * 5 + (state === CHARGE ? ((tick >> 3) & 1) : 0), R2 = R * R, Ri2 = R2 * 0.3;
    const par = (tick >> 3) & 1, r = Math.ceil(R);
    for (let y = -r; y <= r; y++) {
      for (let x = -r; x <= r; x++) {
        const d2 = x * x + y * y;
        if (d2 > R2) continue;
        const X = gemWX + x, Y = gemWY + y;
        if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
        const i = Y * W + X;
        if (!isBack(fb[i])) continue;
        if (((X + Y + par) & 1) === 0) fb[i] = d2 < Ri2 && g > 0.5 ? MAG : MAG_D;
      }
    }
  }

  function blitSprite() {
    const bx = WX - AX, by = WY - AY;
    for (let y = 0; y < SH; y++) {
      const Y = by + y;
      if (Y < 0 || Y >= H) continue;
      for (let x = 0; x < SW; x++) {
        const v = spr[y * SW + x];
        if (v === EMPTY) continue;
        const X = bx + x;
        if (X >= 0 && X < W) fb[Y * W + X] = v === OL ? OUT : v;
      }
    }
  }

  function drawGem(g) {
    const x = gemWX, y = gemWY;
    put(x, y - 2, OUT); put(x - 1, y - 1, OUT); put(x + 1, y - 1, OUT); put(x - 2, y, OUT);
    put(x + 2, y, OUT); put(x - 1, y + 1, OUT); put(x + 1, y + 1, OUT); put(x, y + 2, OUT);
    const flick = g > 0.6 ? (((tick >> 2) ^ (tick >> 3) ^ (tick >> 5)) & 1) : 0;
    put(x, y - 1, MAG_L); put(x - 1, y, MAG_L); put(x + 1, y, MAG); put(x, y + 1, g > 0.6 ? MAG : MAG_D);
    put(x, y, flick || ringT < 6 ? WHITE : MAG_L);
    if (state === CHARGE && flick && st > 30) {
      put(x, y - 3, MAG_L); put(x, y + 3, MAG_L); put(x - 3, y, MAG_L); put(x + 3, y, MAG_L);
    }
  }

  function drawParticles() {
    for (let i = 0; i < NP; i++) {
      if (pM[i] === 0) continue;
      let idx = ((1 - pL[i] / pMax[i]) * 8) | 0;
      if (idx > 7) idx = 7;
      const base8 = pRamp[i] * 8;
      const x = Math.round(pX[i]), y = Math.round(pY[i]);
      put(x, y, RAMP[base8 + idx]);
      if (pM[i] === FREE && idx < 4 && pVX[i] * pVX[i] + pVY[i] * pVY[i] > 0.8) {
        put(Math.round(pX[i] - pVX[i]), Math.round(pY[i] - pVY[i]), RAMP[base8 + idx + 2]);
      }
    }
  }

  function drawProjectile() {
    if (!prOn) return;
    const x = Math.round(pr[0]), y = Math.round(pr[1]), f = (prAge >> 2) & 1;
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -5; dx <= 4; dx++) {
        const X = x + dx, Y = y + dy;
        if (dx * dx + dy * dy > 16 || X < 0 || Y < 0 || X >= W || Y >= H) continue;
        const i = Y * W + X;
        if (isBack(fb[i]) && ((X + Y + f) & 1) === 0) fb[i] = MAG_D;
      }
    }
    put(x - 4, y, MAG); put(x - 3, y, CYAN); put(x - 3, y - 1, MAG_D); put(x - 3, y + 1, MAG_D);
    put(x - 2, y - 1, MAG); put(x - 2, y + 1, MAG); put(x + 2, y, MAG);
    put(x, y - 2, f ? MAG_L : MAG); put(x, y + 2, f ? MAG_L : MAG);
    put(x - 1, y, MAG_L); put(x + 1, y, MAG_L); put(x, y - 1, MAG_L); put(x, y + 1, MAG_L);
    put(x - 1, y - 1, MAG); put(x + 1, y - 1, MAG); put(x - 1, y + 1, MAG); put(x + 1, y + 1, MAG);
    put(x, y, WHITE); put(x + 1, y, f ? WHITE : MAG_L);
  }

  function drawBurst() {
    if (ringT >= 14) return;
    const r = 2 + ringT * 1.6;
    const c = ringT < 3 ? WHITE : ringT < 7 ? MAG_L : MAG;
    for (let k = 0; k < 64; k++) {
      if (ringT >= 8 && (k & 1)) continue;
      put(Math.round(fireX + COS64[k] * r), Math.round(fireY + SIN64[k] * r), c);
    }
    if (ringT < 5) {
      for (let k = 0; k < 64; k += 8) {
        for (let q = 1; q <= 3; q++) {
          const rr = r + q * 2;
          put(Math.round(fireX + COS64[k] * rr), Math.round(fireY + SIN64[k] * rr), q === 1 ? WHITE : MAG_L);
        }
      }
    }
    if (ringT < 3) {
      for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) put(fireX + x, fireY + y, WHITE);
    }
  }

  function present() {
    const lut = flashT > 0 ? flash32 : pal32;
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = SHX[10 - shakeT]; sy = SHY[10 - shakeT]; }
    for (let y = 0; y < H; y++) {
      let ry = y - sy;
      if (ry < 0) ry = 0; else if (ry >= H) ry = H - 1;
      const src = ry * W, dst = y * W;
      for (let x = 0; x < W; x++) {
        let rx = x - sx;
        if (rx < 0) rx = 0; else if (rx >= W) rx = W - 1;
        out32[dst + x] = lut[fb[src + rx]];
      }
    }
    octx.putImageData(img, 0, 0);
    dctx.drawImage(off, 0, 0, W, H, ox, oy, W * scale, H * scale);
  }

  function render() {
    const g = S[GLOW];
    fb.set(bg);
    drawAmbient();
    drawFloorLight(g);
    drawHalo(g);
    blitSprite();
    drawGem(g);
    drawParticles();
    drawProjectile();
    drawBurst();
    present();
  }

  // ---- Main loop: fixed 60 Hz simulation, render on rAF ------------------------------
  // Timing floats live in a typed array so the loop never boxes heap numbers.
  const STEP = 1000 / 60, clk = new Float64Array(2); // [last timestamp, accumulator]
  clk[0] = -1;
  enter(IDLE);
  S.set(KEYS[IDLE]);
  buildSprite();
  function frame(now) {
    if (clk[0] < 0) clk[0] = now;
    clk[1] += Math.min(250, now - clk[0]);
    clk[0] = now;
    while (clk[1] >= STEP) { update(); clk[1] -= STEP; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
